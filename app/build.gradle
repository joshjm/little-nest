plugins { id 'com.android.application' }

def keyPath = System.getenv('NEST_KEYSTORE') ?: "${System.getProperty('user.home')}/.local/share/little-nest/signing/release.jks"
def passwordPath = System.getenv('NEST_KEYSTORE_PASSWORD_FILE') ?: "${System.getProperty('user.home')}/.local/share/little-nest/signing/password"
def hasReleaseKey = file(keyPath).exists() && file(passwordPath).exists()

android {
    namespace 'app.littlenest'
    compileSdk 35
    defaultConfig {
        applicationId 'app.littlenest'
        minSdk 28
        targetSdk 35
        versionCode 11
        versionName '1.10.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        def oneDriveClient = providers.gradleProperty('oneDriveClientId').orElse(providers.environmentVariable('ONEDRIVE_CLIENT_ID')).getOrElse('')
        if (oneDriveClient && !(oneDriveClient ==~ /[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/))
            throw new GradleException('Invalid OneDrive application client ID')
        buildConfigField 'String', 'ONEDRIVE_CLIENT_ID', "\"${oneDriveClient}\""
        manifestPlaceholders = [appAuthRedirectScheme: 'app.littlenest']
    }
    signingConfigs {
        localRelease {
            if (hasReleaseKey) {
                storeFile file(keyPath)
                storePassword file(passwordPath).text.trim()
                keyAlias 'little-nest'
                keyPassword file(passwordPath).text.trim()
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseKey) signingConfig signingConfigs.localRelease
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.all {
            if (project.hasProperty('naraCsv')) systemProperty 'naraCsv', project.property('naraCsv')
        }
    }
    lint { abortOnError true }
}

tasks.configureEach {
    if (name == 'packageRelease') {
        doFirst {
            if (!hasReleaseKey) throw new GradleException('Create a private signing key with bash scripts/init-signing.sh before building the release APK.')
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'net.openid:appauth:0.11.1'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
