name: Infrastructure checks

on:
  push:
    paths:
      - 'infra/**'
      - 'docs/architecture/**'
      - 'scripts/render-architecture.py'
      - 'tooling/infra-requirements.txt'
      - 'app/src/main/java/app/littlenest/OneDriveAuth.java'
      - '.github/workflows/infrastructure.yml'
  pull_request:
    paths:
      - 'infra/**'
      - 'docs/architecture/**'
      - 'scripts/render-architecture.py'
      - 'tooling/infra-requirements.txt'
      - 'app/src/main/java/app/littlenest/OneDriveAuth.java'
      - '.github/workflows/infrastructure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.6'
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate
      - run: terraform test -no-color

  diagrams:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tooling/infra-requirements.txt
      - name: Install local rendering tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq graphviz
          python -m pip install -r tooling/infra-requirements.txt
      - name: Render logical architecture views through MCP
        run: python scripts/render-architecture.py
      - uses: actions/upload-artifact@v7
        with:
          name: architecture-views
          path: artifacts/architecture/
          if-no-files-found: error
